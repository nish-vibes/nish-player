name: Build Windows app

on:
  push:
    # main = what users get. release/** = hotfixes for an older line (e.g. release/1.6).
    # v2 = the 2.0 work: built and tested, but never published as a release.
    branches: [main, "release/**", v2]
  workflow_dispatch:
  schedule:
    # Daily: if there is a new yt-dlp, build and test it and publish it in the app update (~3 MB,
    # apppack.py) and the YouTube pack for 2.0 (ytpack.py). Days without a new yt-dlp stop after a quick check.
    - cron: "41 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Scheduled runs only build when yt-dlp has a version the published YouTube pack doesn't have.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: c
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          NEW=$(curl -fsS https://pypi.org/pypi/yt-dlp/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          CUR=$(gh release download youtube-pack --repo "$GITHUB_REPOSITORY" -p youtube-pack.json -O - 2>/dev/null \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo none)
          GO=$(python3 -c "import re,sys; k=lambda v: tuple(int(x) for x in re.findall(r'\d+', v)); print('true' if k(sys.argv[1]) != k(sys.argv[2]) else 'false')" "$NEW" "$CUR")
          echo "yt-dlp on PyPI: $NEW, published YouTube pack: $CUR -> build: $GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Style check (ruff, settings in ruff.toml)
        run: |
          pip install "ruff==0.16.*"
          ruff check --output-format github .

      - name: Decide what to publish
        id: rel
        shell: bash
        run: |
          VER=$(tr -d '[:space:]' < VERSION)      # the app's version
          BASE=$(tr -d '[:space:]' < BASE)        # the full download (engine + AI models) it's made for
          YTV=$(python -c "import yt_dlp.version as v; print(v.__version__)")
          echo "ytdlp=$YTV" >> "$GITHUB_OUTPUT"
          echo "app $VER for base $BASE, yt-dlp $YTV"
          FULL=false           # a full release (the whole app): only when BASE is new, on main or release/**
          UPDATE=false         # the app update (app + YouTube, ~3 MB): from main, whenever either is new
          PACK=false           # the YouTube-only pack for 2.0: from main, whenever its yt-dlp is new
          TAG="v$VER"
          HAVE_BASE=false
          if gh release view "v$BASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then HAVE_BASE=true; fi
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/heads/release/* ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "schedule" && "$HAVE_BASE" == false ]]; then
              if [[ "$VER" != "$BASE" ]]; then
                echo "::error title=version::A new full download (BASE $BASE) must have VERSION $BASE (it is $VER)"
                exit 1
              fi
              FULL=true
              TAG="v$BASE"
              echo "New base $BASE - will publish the full release if everything passes."
            fi
          else
            TAG="v$VER-dev"
            echo "Development build $TAG - kept as a build artifact, not published."
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            CUR=$(gh release download app-update --repo "$GITHUB_REPOSITORY" -p app-update.json -O - 2>/dev/null \
                  | python -c "import json,sys; m=json.load(sys.stdin); print(m['version'], m['youtube'], m['base'])" 2>/dev/null || echo none)
            if [[ "$CUR" != "$VER $YTV $BASE" ]]; then
              UPDATE=true
              echo "App update '$CUR' -> '$VER $YTV $BASE' - will publish it if everything passes."
            fi
            CUR=$(gh release download youtube-pack --repo "$GITHUB_REPOSITORY" -p youtube-pack.json -O - 2>/dev/null \
                  | python -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo none)
            if [[ "$CUR" != "$YTV" ]]; then
              PACK=true
              echo "YouTube pack $CUR -> $YTV - will publish it if everything passes."
            fi
          fi
          # what users run: the published full download of this base (or this build, when it is the new base)
          USERS="dist"
          if [[ "$FULL" == false && "$HAVE_BASE" == true ]]; then USERS="v$BASE"; fi
          echo "Tests run the new app on: $USERS"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "update=$UPDATE" >> "$GITHUB_OUTPUT"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          echo "users=$USERS" >> "$GITHUB_OUTPUT"

      - name: Get the AI models, ffmpeg and Deno (our own copies, release build-parts)
        env:
          PARTS_UPLOAD: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: python tools/build_parts.py

      - name: The AI models load without downloading anything
        shell: pwsh
        run: |
          $env:TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD = "1"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"     # any download attempt fails
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          python -c "import torch; torch.hub.set_dir('models'); from demucs.pretrained import get_model; [get_model(n) for n in ('htdemucs_ft', 'htdemucs_6s')]; print('AI models ok')"

      - name: Make the YouTube pack (yt-dlp + its challenge solver, shipped beside the exe)
        run: python tools/build_youtube_pack.py pack

      - name: Make the app update (our code + the YouTube pack)
        run: python tools/build_app_pack.py pack

      - name: Tests (engine, splitter, updater, colours, opening 1.6 projects, YouTube pack, app update)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\vendor;$env:PATH"
          foreach ($t in "test_engine", "test_splitter", "test_updater", "test_colors", "test_compat", "test_ytpack", "test_apppack") {
            $out = python "tests/$t.py" 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $out
            if ($code -ne 0) {
              $tail = ($out | Select-Object -Last 15) -join "%0A"
              Write-Output "::error title=$t::$tail"
              exit 1
            }
          }

      - name: Build exe
        run: pyinstaller NiSHPlayer.spec --noconfirm
      - name: Stamp the release tag (the app compares it with the latest release)
        shell: pwsh
        run: Set-Content -NoNewline -Encoding utf8 dist\NiSHPlayer\build_tag.txt "${{ steps.rel.outputs.tag }}"

      - name: The YouTube pack loads in the built app (the same pack is published)
        shell: pwsh
        run: |
          $res = Join-Path $PWD "pack-check.txt"
          $p = Start-Process -FilePath "dist\NiSHPlayer\NiSHPlayer.exe" -ArgumentList "--yt-pack-check", "dist\NiSHPlayer\_internal\youtube", $res -Wait -PassThru
          $report = if (Test-Path $res) { Get-Content $res -Raw } else { "no result" }
          Write-Output $report
          if ($p.ExitCode -ne 0 -or $report -notmatch "^ok ") {
            Write-Output ("::error title=youtube-pack::" + ($report -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
            throw "The YouTube pack doesn't load in the built app"
          }
          Write-Output "::notice title=youtube-pack::$report"

      - name: Get the users' app (the published full download of this base)
        if: steps.rel.outputs.users != 'dist'
        shell: pwsh
        run: |
          gh release download "${{ steps.rel.outputs.users }}" --repo "$env:GITHUB_REPOSITORY" -p NiSHPlayer-windows.zip -D users-zip
          7z x users-zip\NiSHPlayer-windows.zip -ousers -y | Out-Null
          Remove-Item users-zip -Recurse -Force

      - name: The app update runs in the users' app (import everything, compile, load YouTube)
        shell: pwsh
        run: |
          $exe = if ("${{ steps.rel.outputs.users }}" -eq "dist") { "dist\NiSHPlayer\NiSHPlayer.exe" } else { "users\NiSHPlayer\NiSHPlayer.exe" }
          $res = Join-Path $PWD "app-check.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--app-pack-check", (Resolve-Path pack\app), $res, (Resolve-Path pack\youtube) -Wait -PassThru
          $report = if (Test-Path $res) { Get-Content $res -Raw } else { "no result" }
          Write-Output $report
          if ($p.ExitCode -ne 0 -or $report -notmatch "^ok ") {
            Write-Output ("::error title=app-update::" + ($report -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
            throw "The app update doesn't run in the users' app. If the engine changed, set BASE to VERSION (a new full download)."
          }
          Write-Output "::notice title=app-update::$report"

      - name: GUI smoke test (the new app in the users' app - opens the window and clicks through everything)
        shell: pwsh
        run: |
          $out = Join-Path $PWD "gui-smoke"
          if ("${{ steps.rel.outputs.users }}" -eq "dist") {
            $p = Start-Process -FilePath "dist\NiSHPlayer\NiSHPlayer.exe" -ArgumentList "--gui-smoketest", $out -PassThru
          } else {
            $p = Start-Process -FilePath "users\NiSHPlayer\NiSHPlayer.exe" -ArgumentList "--app-dir", (Resolve-Path pack\app), "--gui-smoketest", $out -PassThru
          }
          if (-not $p.WaitForExit(2400000)) { $p.Kill(); $timedOut = $true }
          $report = ""
          if (Test-Path "$out\gui_smoketest.txt") { $report = Get-Content "$out\gui_smoketest.txt" -Raw }
          if (Test-Path "$out\gui_smoketest_hang.txt") { $report += "`n--- hang ---`n" + (Get-Content "$out\gui_smoketest_hang.txt" -Raw) }
          $applog = Join-Path $env:LOCALAPPDATA "NiSH Player\log.txt"
          if (Test-Path $applog) { $report += "`n--- app log ---`n" + (Get-Content $applog -Raw) }
          Write-Output $report
          if ($timedOut -or $p.ExitCode -ne 0 -or $report -notmatch "GUI SMOKETEST PASSED") {
            $msg = ("timedOut=$timedOut exit=$($p.ExitCode)`n" + $report) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            if ($msg.Length -gt 20000) { $msg = $msg.Substring($msg.Length - 20000) }
            Write-Output "::error title=gui-smoketest::$msg"
            throw "GUI smoke test failed"
          }
          $short = (($report -replace "`r", "" -split "`n") | Where-Object { $_ -match "^(ok|skip|window)" }) -join "%0A"
          Write-Output "::notice title=gui-smoketest::$short"

      - name: Try a real YouTube download (informational, YouTube often blocks CI servers)
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $PWD "yt-test"
          $p = Start-Process -FilePath "dist\NiSHPlayer\NiSHPlayer.exe" -ArgumentList "--yt-selftest", "https://www.youtube.com/watch?v=jNQXAC9IVRw", $out -Wait -PassThru
          $report = ""
          if (Test-Path "$out\yt_selftest.txt") { $report = Get-Content "$out\yt_selftest.txt" -Raw }
          Write-Output $report
          $msg = $report -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          if ($p.ExitCode -ne 0) { Write-Output "::warning title=youtube-test::$msg"; throw "YouTube test failed" }
          Write-Output "::notice title=youtube-test::$msg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: gui-smoke/*.png
          retention-days: 14

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\NiSHPlayer\README.txt
          7z a -tzip -mx=5 NiSHPlayer-windows.zip .\dist\NiSHPlayer
          "{0:N0} MB" -f ((Get-Item NiSHPlayer-windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: NiSHPlayer-windows
          path: NiSHPlayer-windows.zip
          retention-days: 14

      - name: Publish release
        if: steps.rel.outputs.full == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NiSH Player ${{ steps.rel.outputs.tag }}
          body: "Built with yt-dlp ${{ steps.rel.outputs.ytdlp }}."
          make_latest: true
          files: NiSHPlayer-windows.zip

      - name: Publish the app update
        if: steps.rel.outputs.update == 'true'
        shell: bash
        run: |
          R=app-update
          M=$(python -c "import json; m=json.load(open('pack/app-update.json')); print(m['version'], 'for', m['base'], 'with yt-dlp', m['youtube'])")
          NOTES="App update for NiSH Player: $M. The app installs it from the cogwheel menu; you don't need to download anything here."
          if ! gh release view $R --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a pre-release, so the app's "latest release" check never sees it
            gh release create $R --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "App update" --notes "$NOTES"
          fi
          gh release upload $R pack/app-update-*.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload $R pack/app-update.json --repo "$GITHUB_REPOSITORY" --clobber   # last: it points to the zip
          gh release edit $R --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          # keep the four newest updates
          gh release view $R --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | [.createdAt, .name] | @tsv' \
            | grep -P '\tapp-update-.*\.zip$' | sort -r | tail -n +5 | cut -f2 \
            | while read -r a; do gh release delete-asset $R "$a" --repo "$GITHUB_REPOSITORY" -y; done

      - name: Publish the YouTube pack
        if: steps.rel.outputs.pack == 'true'
        shell: bash
        run: |
          R=youtube-pack
          YTV="${{ steps.rel.outputs.ytdlp }}"
          EJS=$(python -c "import json; print(json.load(open('pack/youtube-pack.json'))['ejs'])")
          NOTES="YouTube support for NiSH Player 2.0 (2.1 and later get it in the app update): yt-dlp $YTV (yt-dlp-ejs $EJS). The app installs it from the cogwheel menu; you don't need to download anything here."
          if ! gh release view $R --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a pre-release, so the app's "latest release" check never sees it
            gh release create $R --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "YouTube pack" --notes "$NOTES"
          fi
          gh release upload $R pack/youtube-pack-*.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload $R pack/youtube-pack.json --repo "$GITHUB_REPOSITORY" --clobber   # last: it points to the zip
          gh release edit $R --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          # keep the four newest packs
          gh release view $R --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E '^youtube-pack-.*\.zip$' \
            | sort -r | tail -n +5 | while read -r a; do gh release delete-asset $R "$a" --repo "$GITHUB_REPOSITORY" -y; done
